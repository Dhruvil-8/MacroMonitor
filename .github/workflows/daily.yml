name: Daily Market Pipeline (Lightweight)

on:
  schedule:
    # 23:00 UTC = ~4:30 AM IST (every day)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-refresh:
    name: Daily Fast Ingestion & Market Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e pipeline/

      - name: Execute Daily Pipeline (Fast)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          PYTHONPATH=pipeline/src python -m radar.cli all --cadence daily

      - name: Auto-Commit & Push Daily Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/v1/ data/processed/
          git diff --staged --quiet || (git commit -m "chore(data): daily macro market update" && git push)
