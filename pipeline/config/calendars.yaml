# pipeline/config/calendars.yaml
# Market close timestamp rules for time-zone synchronization (Section 3.4)
# Used by Move Decomposer to align asynchronous international market closes.
# Format:
#   id: series slug
#   tz: IANA time zone identifier (handled via Python zoneinfo)
#   close_time: local market close time (HH:MM in 24h format) or reference fix time
#   source_note: official exchange or fix provider documentation

